[project]
name = "trial-scout"
version = "0.1.0"
description = "Parkinson's clinical trial monitor for one person's situation. Decision support only, not medical advice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trial-scout = "trial_scout.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trial_scout"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
